  <style>
  /* ============================================================
     TOKEN — cambia qui e cambia tutta l'app.
     ============================================================ */
  :root {
    --blu: #1553E6;          /* azioni e stati attivi */
    --blu-vivo: #3B78FF;     /* accento luminoso, bordi, dettagli */
    --blu-scuro: #0A3AA8;
    --blu-logo: #004AAD;     /* il blu esatto del simbolo dell'oratorio */
    --blu-tenue: #E9F0FE;
    --ambra: #FFB020;        /* serate ed eventi */
    --ambra-tenue: #FFF3DA;
    --fondo: #F5F7FB;
    --superficie: #FFFFFF;
    --testo: #111520;
    --muto: #6A7285;
    --linea: #E3E8F2;
    --viola: #6B3FBF;
    --viola-tenue: #EFE9FC;
    --rosso: #D6343A;
    --rosso-tenue: #FDECEC;
    --raggio: 18px;
    --raggio-s: 12px;
    --raggio-xs: 9px;
    --tocco: 48px;
    --ombra: 0 1px 2px rgba(17,21,32,.05), 0 8px 24px rgba(17,21,32,.05);
    --ombra-alta: 0 2px 6px rgba(17,21,32,.07), 0 16px 40px rgba(17,21,32,.09);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    letter-spacing: -0.005em;
    color: var(--testo);
    background: var(--fondo);
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
  }
  a { color: var(--blu); text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
  h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
  h2 { font-size: 1.22rem; font-weight: 700; margin: 28px 0 12px; }
  h3 { font-size: 1rem; font-weight: 700; }
  p { margin: 0 0 8px; }
  .muto { color: var(--muto); }
  .piccolo { font-size: .875rem; }
  .nascosto { display: none !important; }

  /* ============================================================
     INTESTAZIONE E NAVIGAZIONE
     ============================================================ */
  header.barra {
    background: var(--blu-logo);
    color: #fff;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 5;
  }
  header.barra .marchio {
    width: 30px; height: 42px; flex: 0 0 auto;
    background: var(--logo-donbosco) center/contain no-repeat;
  }
  header.barra .testi { flex: 1; min-width: 0; }
  header.barra h1 { font-size: .98rem; font-weight: 650; }
  header.barra .chi {
    font-size: .8rem; opacity: .82; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  main { padding: 18px 16px 8px; max-width: 640px; margin: 0 auto; }

  nav.fondo {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; gap: 2px;
    background: rgba(255,255,255,.92);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    backdrop-filter: saturate(1.6) blur(14px);
    border-top: 1px solid var(--linea);
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  nav.fondo button {
    flex: 1 1 0; min-width: 0; min-height: 58px;
    background: none; border: 0; border-radius: var(--raggio-s);
    font: inherit; font-size: .69rem; font-weight: 600; letter-spacing: 0;
    color: var(--muto);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; padding: 0 2px;
    transition: background-color .15s, color .15s;
  }
  nav.fondo button svg { width: 23px; height: 23px; display: block; stroke-width: 1.7; }
  nav.fondo button .nome { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
/* =====================================================================
   STATO E UTILITÀ
   ===================================================================== */
// Cambia a ogni modifica dell'interfaccia: compare in fondo alla scheda "Io",
// così si capisce subito se il telefono sta eseguendo la versione aggiornata.
const VERSIONE_APP = '2026.09.17';

/* =====================================================================
   CONFIGURAZIONE
   L'indirizzo del server sta in config.js, che si carica una volta sola e
   non va più toccato: così aggiornare questo file non lo cancella.
   ===================================================================== */
const URL_APP = (typeof window.URL_APP === 'string' ? window.URL_APP : '').trim();

const S = {
  codice: localStorage.getItem('oratorio_codice') || '',
  token: localStorage.getItem('oratorio_token') || null,
  utente: null,
  liste: null,
  giochi: null,
  animatori: null,
  calendario: null,
  schermata: 'sabato',
  richiesteInCorso: 0
};

const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

/*
 * I metodi nativi replaceChildren e append convertono null e undefined in un
 * nodo di testo "null": è da lì che arrivavano i "nullnull" sparsi nelle
 * schede, perché le espressioni condizionali che non producono nulla venivano
 * stampate. Qui li si fa ignorare, come fa già h().
 */
['replaceChildren', 'append'].forEach(metodo => {
  const nativo = Element.prototype[metodo];
  Element.prototype[metodo] = function (...figli) {
    return nativo.apply(this, figli.filter(f => f !== null && f !== undefined && f !== false));
  };
});

/** Crea un elemento: h('div', {class:'x', onclick:fn}, [figli...]) */
function h(tag, attrs, figli) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') el.className = attrs[k];
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'html') el.innerHTML = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
  }
  (Array.isArray(figli) ? figli : [figli]).forEach(f => {
    if (f === null || f === undefined || f === false) return;
    el.appendChild(typeof f === 'string' || typeof f === 'number' ? document.createTextNode(String(f)) : f);
  });
  return el;
}

function select(opzioni, valore, attrs) {
  const sel = h('select', attrs || {});
  opzioni.forEach(o => {
    const v = typeof o === 'string' ? o : o.v;
    const t = typeof o === 'string' ? o : o.t;
    const op = h('option', { value: v }, t);
    if (v === valore) op.selected = true;
    sel.appendChild(op);
  });
  return sel;
}

/* ---------------------------------------------------------------------
   Icone: tracciati monocromatici disegnati a mano, non emoji.
   Ereditano il colore dal pulsante (stroke="currentColor"), così cambiano
   da soli quando la scheda diventa attiva.
   --------------------------------------------------------------------- */
const ICONE = {
  sabato:    'M8 3v3M16 3v3M3.5 9.5h17M4.5 6.5h15a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1zM9 14.5l2 2 4-4',
  io:        'M12 11.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6',
  anno:      'M8 3v3M16 3v3M3.5 9.5h17M4.5 6.5h15a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1zM7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2M14.5 16.5h2',
  giochi:    'M12 2.6l8 4.7v9.4l-8 4.7-8-4.7V7.3zM12 2.6v18.8M4 7.3l8 4.7 8-4.7M8.5 10.2v2M15.5 10.2v2',
  gestione:  'M4 20l.9-3.6L15.3 6a1.8 1.8 0 0 1 2.6 0l.6.6a1.8 1.8 0 0 1 0 2.6L8.1 19.6zM13.8 7.6l2.6 2.6',
  admin:     'M5 7h9M17.5 7H19M5 12h3M11.5 12H19M5 17h9M17.5 17H19M15.5 7a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM10 12a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM15.5 17a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z',
  freccia:   'M6 9.5l6 6 6-6',
  vai:       'M9 5.5l6.5 6.5L9 18.5'
};

function icona(nome, classe) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  if (classe) svg.setAttribute('class', classe);
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', ICONE[nome]);
  svg.appendChild(p);
  return svg;
}

/** Tendina richiudibile con titolo, contatore facoltativo e freccia animata. */
function tendina(titolo, conta, contenuto, aperta) {
  const d = h('details', { class: 'tendina' });
  if (aperta) d.open = true;
  d.appendChild(h('summary', {}, [
    h('span', {}, titolo),
    conta ? h('span', { class: 'conta' }, conta) : null,
    icona('freccia', 'freccia')
  ]));
  d.appendChild(h('div', { class: 'contenuto' }, contenuto));
  return d;
}

function toast(msg, errore) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on' + (errore ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, errore ? 4500 : 2200);
}

function attesa(on) {
  S.richiesteInCorso += on ? 1 : -1;
  document.getElementById('attesa').className = S.richiesteInCorso > 0 ? 'on' : '';
}

/**
 * Chiamata al server. Il corpo viaggia come testo semplice: dichiararlo JSON
 * farebbe partire la richiesta di verifica preliminare del browser, a cui
 * Apps Script non sa rispondere. Il contenuto resta JSON e il server lo
 * interpreta come tale.
 * In caso di errore rifiuta con una stringa leggibile, non con un oggetto.
 */
async function api(azione, dati) {
  if (!/^https:\/\/script\.google\.com\/macros\/.+\/exec$/.test(URL_APP)) {
    throw 'Manca l\'indirizzo del server: apri config.js e incolla l\'URL della distribuzione Apps Script (finisce in /exec).';
  }
  attesa(true);
  let risposta;
  try {
    risposta = await fetch(URL_APP, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ azione, token: S.token, dati: dati || {} })
    });
  } catch (e) {
    attesa(false);
    throw 'Connessione fallita. Controlla la rete e riprova.';
  }
  let r;
  try { r = await risposta.json(); }
  catch (e) { attesa(false); throw 'Risposta non leggibile dal server (' + risposta.status + ').'; }
  attesa(false);
  if (r && r.ok) return r.dati;
  const msg = (r && r.errore) || 'Errore sconosciuto.';
  if (/Sessione scaduta/.test(msg)) esci();
  throw msg;
}

function dataDaId(id) { return new Date(+id.slice(0,4), +id.slice(4,6)-1, +id.slice(6,8)); }
function oggiId() { const d = new Date(); return d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2); }
function mostra(el) { document.getElementById('main').replaceChildren(el); window.scrollTo(0, 0); }
function vuoto(testo) { return h('p', { class: 'vuoto' }, testo); }
function errore(msg) { return h('div', { class: 'errore' }, msg); }

/* =====================================================================
   AVVIO, ACCESSO, NAVIGAZIONE
   ===================================================================== */
async function avvio() {
  if (!S.token) return schermataAccesso();
  try {
    const io = await api('io');
    S.utente = io.utente;
    dopoAccesso();
    schermataSabato();
  } catch (e) {
    S.token = null; localStorage.removeItem('oratorio_token');
    schermataAccesso();
  }
}

async function schermataAccesso(messaggio) {
  document.getElementById('nav').classList.add('nascosto');
  document.getElementById('barra').classList.add('nascosto');
  document.getElementById('chi').textContent = '';

  // Passo 1: il codice dell'oratorio, chiesto una volta sola e poi ricordato.
  if (!S.codice) return schermataCodice(messaggio);

  const box = h('div', { class: 'accesso' }, [h('p', { class: 'muto' }, 'Carico i nomi…')]);
  mostra(box);
  let nomi = [];
  try {
    nomi = await api('elencoNomi', { codice: S.codice });
  } catch (e) {
    if (/[Cc]odice/.test(e)) {
      S.codice = ''; localStorage.removeItem('oratorio_codice');
      return schermataCodice('Il codice non è più valido: inseriscilo di nuovo.');
    }
    box.replaceChildren(errore(e));
    return;
  }

  const sel = select([{ v: '', t: 'Scegli il tuo nome' }].concat(nomi.map(n => ({ v: n.id, t: n.nomeVis }))), localStorage.getItem('oratorio_id') || '');
  const pin = h('input', { class: 'pin', type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '6', autocomplete: 'off', placeholder: '••••••' });
  const btn = h('button', { class: 'b largo', onclick: entra }, 'Entra');
  const msg = h('div');

  async function entra() {
    if (!sel.value) { msg.replaceChildren(errore('Scegli il tuo nome.')); return; }
    if (!/^\d{6}$/.test(pin.value)) { msg.replaceChildren(errore('Il PIN ha 6 cifre.')); return; }
    btn.disabled = true;
    try {
      const r = await api('login', { id: sel.value, pin: pin.value });
      S.token = r.token; S.utente = r.utente;
      localStorage.setItem('oratorio_token', r.token);
      localStorage.setItem('oratorio_id', sel.value);
      dopoAccesso();
      schermataSabato();
    } catch (e) { msg.replaceChildren(errore(e)); btn.disabled = false; pin.value = ''; pin.focus(); }
  }
  pin.addEventListener('keydown', e => { if (e.key === 'Enter') entra(); });

  box.replaceChildren(
    h('div', { class: 'simbolo' }),
    h('h2', {}, 'Oratorio Don Bosco'),
    h('p', { class: 'sotto' }, 'Sangano'),
    messaggio ? h('div', { class: 'avviso' }, messaggio) : null,
    h('label', {}, 'Nome'), sel,
    h('label', {}, 'PIN'), pin,
    h('div', { style: 'margin-top:20px' }, btn),
    msg,
    h('p', { class: 'muto piccolo', style: 'margin-top:22px' },
      'Se non hai un PIN o l\'hai dimenticato, chiedilo a un amministratore.'),
    h('div', { style: 'margin-top:10px' },
      h('button', { class: 'b secondario piccolo', onclick: () => {
        S.codice = ''; localStorage.removeItem('oratorio_codice'); schermataCodice();
      } }, 'Cambia oratorio'))
  );
}

/** Passo 1 dell'accesso: il codice unico dell'oratorio. */
function schermataCodice(messaggio) {
  const campo = h('input', { type: 'text', autocapitalize: 'none', autocomplete: 'off', placeholder: 'Codice oratorio' });
  const msg = h('div');
  const btn = h('button', { class: 'b largo', onclick: avanti }, 'Continua');

  async function avanti() {
    const c = campo.value.trim();
    if (!c) { msg.replaceChildren(errore('Inserisci il codice.')); return; }
    btn.disabled = true;
    try {
      await api('elencoNomi', { codice: c });
      S.codice = c;
      localStorage.setItem('oratorio_codice', c);
      schermataAccesso();
    } catch (e) { msg.replaceChildren(errore(e)); btn.disabled = false; campo.select(); }
  }
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') avanti(); });

  mostra(h('div', { class: 'accesso' }, [
    h('div', { class: 'simbolo' }),
    h('h2', {}, 'Oratorio Don Bosco'),
    h('p', { class: 'sotto' }, 'Sangano'),
    messaggio ? h('div', { class: 'avviso' }, messaggio) : null,
    h('p', { class: 'muto piccolo' }, 'Inseriscilo una volta sola: il telefono lo ricorda.'),
    h('label', {}, 'Codice oratorio'), campo,
    h('div', { style: 'margin-top:20px' }, btn),
    msg
  ]));
  campo.focus();
}

function dopoAccesso() {
  document.getElementById('barra').classList.remove('nascosto');
  document.getElementById('chi').textContent = S.utente.nomeVis + ' · ' + S.utente.grado;
  const nav = document.getElementById('nav');
  nav.classList.remove('nascosto');
  const voci = [
    ['sabato', 'sabato', 'Sabato'],
    ['io', 'io', 'Io'],
    ['calendario', 'anno', 'Anno'],
    ['giochi', 'giochi', 'Giochi']
  ];
  if (S.utente.livello >= 3) voci.push(['gestione', 'gestione', 'Gestione']);
  if (S.utente.livello >= 4) voci.push(['admin', 'admin', 'Admin']);
  nav.replaceChildren(...voci.map(v => h('button', { id: 'nav-' + v[0], 'aria-label': v[2], onclick: () => vai(v[0]) },
    [icona(v[1]), h('span', { class: 'nome' }, v[2])])));
  segnaNav('sabato');
}

function segnaNav(nome) {
  S.schermata = nome;
  document.querySelectorAll('nav.fondo button').forEach(b => {
    const on = b.id === 'nav-' + nome;
    b.classList.toggle('attivo', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

function vai(nome) {
  segnaNav(nome);
  ({ sabato: schermataSabato, io: schermataIo, calendario: schermataCalendario, giochi: schermataGiochi,
     gestione: schermataGestione, admin: schermataAdmin })[nome]();
}

function esci() {
  S.token = null; S.utente = null;
  localStorage.removeItem('oratorio_token');   // il codice oratorio resta
  schermataAccesso('Sessione terminata. Accedi di nuovo.');
}

/* Elenchi condivisi (in memoria per tutta la sessione) */
async function caricaAnimatori() { if (!S.animatori) S.animatori = await api('elencoAnimatori'); return S.animatori; }
async function caricaGiochi() { if (!S.giochi) S.giochi = await api('giochi'); return S.giochi; }
async function caricaListe() { if (!S.liste) S.liste = await api('liste'); return S.liste; }
async function caricaCalendario() { if (!S.calendario) S.calendario = await api('calendario'); return S.calendario; }

/* =====================================================================
   SCHERMATA 2 — SABATO
   ===================================================================== */
async function schermataSabato(idData) {
  segnaNav('sabato');
  mostra(h('p', { class: 'muto' }, 'Carico il programma…'));
  let d;
  try { d = await (idData ? api('sabato', { idData }) : api('prossimoSabato')); }
  catch (e) { mostra(errore(e)); return; }
  mostra(vistaSabato(d));
}

function intestazioneData(cal) {
  const dt = dataDaId(cal.idData);
  return h('div', { class: 'hero' }, [
    h('div', { class: 'occhiello' }, cal.prossimo ? 'Prossimo sabato' : 'Sabato'),
    h('div', { class: 'linea' }, [
      h('div', { class: 'giorno' }, dt.getDate()),
      h('div', {}, [
        h('div', { class: 'mese' }, MESI[dt.getMonth()] + ' ' + dt.getFullYear()),
        cal.tipo === 'Chiuso' ? null : h('div', { class: 'orari' }, cal.oraInizio + ' – ' + cal.oraFine + (cal.serata ? ' · con serata' : ''))
      ])
    ]),
    cal.evento ? h('div', { class: 'evento' }, cal.evento) : null,
    cal.nota && cal.tipo !== 'Chiuso' ? h('p', { class: 'nota' }, cal.nota) : null
  ]);
}

function vistaSabato(d) {
  const cal = d.calendario; cal.prossimo = d.prossimo;
  const box = h('div', {}, intestazioneData(cal));

  if (cal.tipo === 'Chiuso') {
    box.appendChild(h('div', { class: 'chiuso' }, 'L\'oratorio è chiuso' + (cal.nota ? ': ' + cal.nota : '.')));
  } else {
    // presenza (solo per date non passate)
    if (cal.idData >= oggiId()) box.appendChild(blocchettoPresenza(cal.idData, d.presenzaMia));

    // le attività dell'ora prima della Messa stanno insieme al gioco libero,
    // in una tendina: sono sei ogni sabato e affogherebbero il resto
    const attivita = d.voci.filter(v => v.categoria === 'Attività');
    const principali = d.voci.filter(v => v.categoria !== 'Attività');

    box.appendChild(h('h2', {}, 'Programma'));
    if (!principali.length) box.appendChild(vuoto('Programma non ancora definito.'));
    const lista = h('div', { class: 'lista' });
    principali.forEach(v => lista.appendChild(rigaVoce(v, cal.idData)));
    box.appendChild(lista);

    if (attivita.length || d.ricorrenti.length) {
      const dentro = h('div', {});
      if (attivita.length) {
        const l1 = h('div', { class: 'lista', style: 'margin-top:12px' });
        attivita.forEach(v => l1.appendChild(rigaVoce(v, cal.idData)));
        dentro.appendChild(l1);
      }
      if (d.ricorrenti.length) {
        const l2 = h('div', { class: 'lista', style: 'margin-top:12px' });
        d.ricorrenti.forEach(r => l2.appendChild(h('div', { class: 'riga' + (r.coinvolto ? ' mia' : '') }, [
          h('div', { class: 'titolo' }, r.attivita),
          r.persone.length ? h('div', { class: 'persone' }, testoPersone(r.persone)) : null
        ])));
        dentro.appendChild(l2);
      }
      const mie = attivita.some(v => v.coinvolto) || d.ricorrenti.some(r => r.coinvolto);
      box.appendChild(h('div', { style: 'margin-top:10px' },
        tendina('Attività e gioco libero', attivita.length + d.ricorrenti.length, dentro, mie)));
    }
  }
  if (!d.prossimo) box.appendChild(h('div', { class: 'azioni' }, h('button', { class: 'b secondario', onclick: () => schermataSabato() }, 'Vai al prossimo sabato')));
  return box;
}

function testoPersone(persone) {
  const el = h('span');
  persone.forEach((p, i) => {
    if (i) el.appendChild(document.createTextNode(', '));
    const testo = p.nomeVis + (p.ruolo === 'Aiuto' ? ' (aiuto)' : p.ruolo === 'Recita' ? ' (recita)' : '');
    el.appendChild(h('span', {
      class: (p.ruolo === 'Responsabile' ? 'resp' : '') + (p.presenza === 'assente' ? ' assente' : ''),
      title: p.presenza === 'assente' ? 'Ha detto che non ci sarà' : (p.presenza === 'nessuna' ? 'Non ha ancora risposto' : '')
    }, testo + (p.presenza === 'assente' ? ' — assente' : '')));
  });
  return el;
}

function blocchettoPresenza(idData, stato) {
  const si = h('button', { class: stato === 'presente' ? 'on' : '' }, 'Ci sono');
  const no = h('button', { class: stato === 'assente' ? 'on no' : '' }, 'Non ci sono');
  async function salva(presente) {
    try {
      const r = await api('salvaPresenza', { idData, stato: presente });
      si.className = r.stato === 'presente' ? 'on' : '';
      no.className = r.stato === 'assente' ? 'on no' : '';
      toast(r.stato === 'presente' ? 'Presenza confermata' : 'Assenza registrata');
    } catch (e) { toast(e, true); }
  }
  si.onclick = () => salva(true);
  no.onclick = () => salva(false);
  return h('div', { class: 'modulo' }, [
    h('div', { class: 'piccolo muto' }, stato === 'nessuna' ? 'Non hai ancora detto se ci sarai.' : 'La tua presenza'),
    h('div', { class: 'segmento' }, [si, no])
  ]);
}

/** Una voce di programma nella vista del sabato, con modifica inline se permessa. */
function rigaVoce(v, idData) {
  const riga = h('div', { class: 'riga' + (v.coinvolto ? ' mia' : '') });
  const corpo = h('div');
  function disegna() {
    corpo.replaceChildren(
      h('div', { class: 'titolo' }, [v.attivita,
        v.fascia && v.fascia !== 'Tutti' ? h('span', { class: 'etichetta' }, v.fascia) : null,
        v.scoperto ? h('span', { class: 'etichetta rossa' }, 'responsabile assente') : null]),
      h('div', {}, v.descrizione || h('span', { class: 'muto' }, 'da definire')),
      v.tema ? h('div', { class: 'sotto' }, 'Tema del periodo: ' + v.tema) : null,
      v.materiale ? h('div', { class: 'sotto' }, 'Materiale: ' + v.materiale) : null,
      v.link ? h('div', { class: 'sotto' }, h('a', { href: v.link, target: '_blank', rel: 'noopener' }, 'Apri il documento della serata')) : null,
      v.postazioni && v.postazioni.length ? elencoPostazioni(v.postazioni) : null,
      v.note && !v.link ? h('div', { class: 'sotto' }, v.note) : null,
      v.persone.length ? h('div', { class: 'persone' }, testoPersone(v.persone)) : null,
      v.idGioco ? h('div', { class: 'sotto' }, h('a', { href: '#', onclick: e => { e.preventDefault(); apriGioco(v.idGioco); } }, 'Come si gioca')) : null,
      v.possoModificare ? h('div', { class: 'azioni' }, h('button', { class: 'b secondario piccolo', onclick: modifica }, 'Modifica')) : null
    );
  }
  async function modifica() {
    const form = await moduloProgramma(v, r => { v.dettaglio = r.dettaglio; v.note = r.note; v.descrizione = r.descrizione; v.idGioco = r.idGioco; v.materiale = r.materiale; v.link = r.link; disegna(); }, disegna);
    corpo.replaceChildren(form);
  }
  disegna();
  riga.appendChild(corpo);
  return riga;
}

/** Elenco compatto delle postazioni di una voce (stand, secondo gioco, serata). */
function elencoPostazioni(post) {
  return h('div', { class: 'postazioni' }, post.map(p => h('div', { class: 'postazione' }, [
    h('span', { class: 'num' }, p.n),
    h('span', { class: 'cosa' }, [
      p.gioco || p.ruolo || h('span', { class: 'muto' }, 'da definire'),
      p.gioco && p.ruolo ? h('span', { class: 'muto' }, ' · ' + p.ruolo) : null
    ]),
    p.nomeVis ? h('span', { class: 'chi' }, p.nomeVis) : h('span', { class: 'chi muto' }, '—'),
    p.idGioco ? h('a', { href: '#', class: 'piccolo', onclick: e => { e.preventDefault(); apriGioco(p.idGioco); } }, 'regole') : null
  ])));
}

/**
 * Tendina per scegliere una scheda dal catalogo, con accanto il pulsante che
 * apre al volo il modulo di creazione: il gioco nuovo viene poi selezionato
 * da solo, senza uscire da dove si stava lavorando.
 * `soloAttivita` restringe l'elenco alle schede di tipo Attività.
 */
async function campoGioco(valore, soloAttivita) {
  const filtra = g => soloAttivita ? g.tipo === 'Attività' : g.tipo !== 'Attività';
  const etichetta = soloAttivita ? '— scegli un\'attività —' : '— scegli un gioco —';

  function opzioni(giochi) {
    return [{ v: '', t: etichetta }].concat(giochi.filter(filtra)
      .map(g => ({ v: g.id, t: g.nome + (g.tipo && !soloAttivita ? ' · ' + g.tipo : '') })));
  }
  const sel = select(opzioni(await caricaGiochi()), valore || '');
  const area = h('div');

  const nuovo = h('button', { class: 'b secondario piccolo', type: 'button', onclick: () => {
    if (area.firstChild) { area.replaceChildren(); nuovo.textContent = testoPulsante; return; }
    nuovo.textContent = 'Chiudi';
    moduloGioco(area, null,
      () => { area.replaceChildren(); nuovo.textContent = testoPulsante; },
      async r => {
        const giochi = await caricaGiochi();
        sel.replaceChildren();
        opzioni(giochi).forEach(o => {
          const op = h('option', { value: o.v }, o.t);
          if (o.v === r.id) op.selected = true;
          sel.appendChild(op);
        });
        area.replaceChildren();
        nuovo.textContent = testoPulsante;
        toast('Aggiunto e selezionato');
      });
  } }, soloAttivita ? '+ Nuova' : '+ Nuovo');
  const testoPulsante = nuovo.textContent;

  const contenitore = h('div', {}, [
    h('div', { style: 'display:flex;gap:8px;align-items:center' }, [h('div', { style: 'flex:1;min-width:0' }, sel), nuovo]),
    area
  ]);
  return { sel, contenitore };
}

/** Modulo di modifica del dettaglio/note di una voce (usato dal sabato e dalla gestione). */
async function moduloProgramma(v, dopo, annulla) {
  // È il server a dirlo (campo vuoleGioco), con la stessa regola che usa per
  // validare il salvataggio: così non può capitare che qui compaia un campo
  // libero e poi il salvataggio venga rifiutato.
  const eGioco = v.vuoleGioco !== undefined
    ? v.vuoleGioco
    : ['Gioco', 'Attività'].includes(v.categoria) || ['GioEle', 'GioMed', 'Est'].includes(v.idAtt);
  let campo, campoVisibile;
  if (eGioco) {
    const c = await campoGioco(v.dettaglio, v.soloAttivita || v.categoria === 'Attività');
    campo = c.sel; campoVisibile = c.contenitore;
  } else {
    campo = h('input', { type: 'text', value: v.dettaglio || '', placeholder: v.categoria === 'Preghiera' ? 'Argomento della preghiera' : v.categoria === 'Serata' ? 'Nome della serata' : 'Dettaglio' });
    campoVisibile = campo;
  }
  const note = h('textarea', { placeholder: v.idAtt === 'Ser' ? 'Link al documento della serata (https://…) o note' : 'Note' }, v.note || '');
  const salva = h('button', { class: 'b', onclick: async () => {
    salva.disabled = true;
    try {
      await api('salvaProgramma', { idProg: v.idProg, dettaglio: campo.value, note: note.value });
      const giochi = eGioco ? await caricaGiochi() : [];
      const g = giochi.find(x => x.id === campo.value);
      toast('Salvato');
      dopo({ dettaglio: campo.value, note: note.value, descrizione: g ? g.nome : campo.value, idGioco: g ? g.id : '', materiale: g ? g.materiale : '', link: (v.idAtt === 'Ser' && /^https?:\/\//i.test(note.value)) ? note.value.trim() : '' });
    } catch (e) { toast(e, true); salva.disabled = false; }
  } }, 'Salva');
  return h('div', { class: 'modulo' }, [
    h('div', { class: 'titolo' }, v.attivita),
    h('label', {}, eGioco ? (v.soloAttivita || v.categoria === 'Attività' ? 'Attività' : 'Gioco') : 'Dettaglio'), campoVisibile,
    h('label', {}, 'Note'), note,
    h('div', { class: 'azioni' }, [salva, h('button', { class: 'b secondario', onclick: annulla }, 'Annulla')])
  ]);
}

/* =====================================================================
   SCHERMATA 3 — IO
   ===================================================================== */
async function schermataIo() {
  mostra(h('p', { class: 'muto' }, 'Carico la tua scheda…'));
  let d;
  try { d = await api('io'); } catch (e) { mostra(errore(e)); return; }
  const box = h('div', {}, [
    h('h2', { style: 'margin-top:4px' }, d.utente.nomeVis),
    h('p', { class: 'muto' }, d.utente.grado)
  ]);

  if (d.prossimo) {
    box.appendChild(h('p', { class: 'piccolo muto', style: 'margin-top:14px' }, 'Prossimo sabato: ' + d.prossimo.testo));
    box.appendChild(blocchettoPresenza(d.prossimo.idData, d.presenzaProssimo));
  }

  box.appendChild(h('h2', {}, 'I miei incarichi'));
  const futuri = d.incarichi.filter(i => i.futuro), passati = d.incarichi.filter(i => !i.futuro);
  if (!futuri.length) box.appendChild(vuoto('Nessun incarico in programma.'));
  const l = h('div', { class: 'lista' });
  futuri.forEach(i => l.appendChild(rigaIncarico(i)));
  box.appendChild(l);
  if (passati.length) {
    const l2 = h('div', { class: 'lista', style: 'margin-top:12px' });
    passati.forEach(i => l2.appendChild(rigaIncarico(i)));
    box.appendChild(h('div', { style: 'margin-top:10px' }, tendina('Incarichi passati', passati.length, l2)));
  }

  if (d.squadre.length) {
    box.appendChild(h('h2', {}, 'Le mie squadre'));
    box.appendChild(h('div', { class: 'lista' }, d.squadre.map(q => h('div', { class: 'riga' }, [h('span', { class: 'titolo' }, [q.attivita, q.ruolo === 'Responsabile' ? h('span', { class: 'etichetta' }, 'responsabile') : null])]))));
  }

  // Le disponibilità estive stanno chiuse: si aprono solo quando servono.
  const rispostoA = d.estate.filter(e => e.risposta).length;
  const dentro = h('div');
  if (!d.estate.length) dentro.appendChild(vuoto('Nessuna proposta ancora aperta.'));
  d.estate.forEach(e => dentro.appendChild(rigaEstate(S.utente.id, e, d.rispostePossibili)));
  box.appendChild(h('h2', {}, 'Estate'));
  box.appendChild(tendina('Disponibilità estate',
    d.estate.length ? rispostoA + ' di ' + d.estate.length : null, dentro));

  box.appendChild(h('div', { class: 'azioni', style: 'margin-top:28px' }, h('button', { class: 'b secondario', onclick: esci }, 'Esci')));
  box.appendChild(h('p', { class: 'muto piccolo', style: 'text-align:center;margin-top:18px' }, 'Versione ' + VERSIONE_APP));
  mostra(box);
}

function rigaIncarico(i) {
  return h('div', { class: 'riga cliccabile', onclick: () => schermataSabato(i.idData) }, [
    h('div', { class: 'titolo' }, [i.breve + ' · ' + i.attivita, i.ruolo === 'Responsabile' ? h('span', { class: 'etichetta' }, 'responsabile') : null]),
    h('div', {}, i.descrizione || h('span', { class: 'muto' }, 'da definire')),
    i.materiale ? h('div', { class: 'sotto' }, 'Materiale: ' + i.materiale) : null,
    i.link ? h('div', { class: 'sotto' }, h('a', { href: i.link, target: '_blank', rel: 'noopener', onclick: e => e.stopPropagation() }, 'Documento della serata')) : null
  ]);
}

/** Riga di disponibilità estiva con salvataggio immediato al cambio. */
function rigaEstate(idAnimatore, e, risposte) {
  const sel = select([{ v: '', t: '—' }].concat(risposte), e.risposta || '');
  const note = h('input', { type: 'text', value: e.note || '', placeholder: 'Note (facoltative)' });
  let timer;
  async function salva() {
    try { await api('salvaEstate', { idAnimatore, proposta: e.proposta, risposta: sel.value, note: note.value }); toast('Salvato'); }
    catch (err) { toast(err, true); }
  }
  sel.onchange = salva;
  note.oninput = () => { clearTimeout(timer); timer = setTimeout(salva, 900); };
  return h('div', { class: 'modulo' }, [h('div', { class: 'titolo' }, e.proposta), h('label', {}, 'Risposta'), sel, h('label', {}, 'Note'), note]);
}

/* =====================================================================
   SCHERMATA 4 — CALENDARIO
   ===================================================================== */
/** Una riga della schermata Anno: un sabato con la sua data a sinistra. */
function rigaSabato(s, oggi) {
  const d = dataDaId(s.idData);
  const cl = ['sab'];
  if (s.tipo === 'Chiuso') cl.push('chiuso');
  else if (s.serata) cl.push('serata');
  if (s.idData === oggi) cl.push('oggi');
  if (s.idData < oggi) cl.push('passato');

  const primaria = h('div', { class: 'primaria' }, [
    s.evento ? s.evento : (s.tipo === 'Chiuso' ? 'Oratorio chiuso' : 'Oratorio'),
    s.serata ? h('span', { class: 'etichetta ambra' }, 'serata') : null
  ]);
  const sotto = s.tipo === 'Chiuso'
    ? (s.nota || 'Nessuna attività')
    : (s.oraInizio + ' – ' + s.oraFine) + (s.nota ? ' · ' + s.nota : '');

  return h('button', { class: cl.join(' '), onclick: () => schermataSabato(s.idData) }, [
    h('div', { class: 'data' }, [
      h('span', { class: 'n' }, d.getDate()),
      h('span', { class: 'g' }, 'sab')
    ]),
    h('div', { class: 'corpo' }, [primaria, h('div', { class: 'secondaria' }, sotto)]),
    icona('vai', 'vai')
  ]);
}

/** Riga di un evento del calendario parrocchiale, con dettaglio apribile. */
function rigaEvento(e, oggi, dopoModifica) {
  const d = dataDaId(e.idData);
  const cl = ['sab', 'ev'];
  if (e.idDataFine < oggi) cl.push('passato');
  if (e.idData === oggi || (e.idData <= oggi && e.idDataFine >= oggi)) cl.push('oggi');

  const orario = e.oraInizio ? (e.oraInizio + (e.oraFine ? '–' + e.oraFine : '')) : 'tutto il giorno';
  const durata = e.piuGiorni ? ' · fino al ' + dataDaId(e.idDataFine).getDate() + ' ' + MESI[dataDaId(e.idDataFine).getMonth()] : '';

  const dettaglio = h('div', { class: 'dettaglio nascosto' }, [
    h('div', {}, orario + durata),
    e.luogo ? h('div', {}, e.luogo) : null,
    e.nota ? h('div', { style: 'margin-top:4px' }, e.nota) : null,
    S.utente.livello >= 3
      ? h('div', { class: 'azioni', style: 'margin-top:10px' },
          h('button', { class: 'b secondario piccolo', onclick: ev => { ev.stopPropagation(); vai('gestione'); setTimeout(() => schermataGestione('eventi', e.id), 0); } }, 'Modifica'))
      : null
  ]);

  const riga = h('button', { class: cl.join(' '), onclick: () => dettaglio.classList.toggle('nascosto') }, [
    h('div', { class: 'data' }, [
      h('span', { class: 'n' }, d.getDate()),
      h('span', { class: 'g' }, GIORNI_BREVI[d.getDay()])
    ]),
    h('div', { class: 'corpo' }, [
      h('div', { class: 'primaria' }, [
        e.titolo,
        e.categoria ? h('span', { class: 'etichetta viola' }, e.categoria) : null
      ]),
      h('div', { class: 'secondaria' }, orario + durata + (e.luogo ? ' · ' + e.luogo : ''))
    ]),
    icona('vai', 'vai')
  ]);
  return h('div', { class: 'sab-riga' }, [riga, dettaglio]);
}

const GIORNI_BREVI = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];

async function schermataCalendario() {
  segnaNav('calendario');
  mostra(h('p', { class: 'muto' }, 'Carico il calendario…'));
  let c, ev;
  try {
    c = await caricaCalendario();
    ev = (await api('eventi')).eventi;
  } catch (e) { mostra(errore(e)); return; }
  if (!c.sabati.length) { mostra(vuoto('Calendario vuoto.')); return; }

  const oggi = oggiId();
  const primo = dataDaId(c.sabati[0].idData);
  const ultimo = dataDaId(c.sabati[c.sabati.length - 1].idData);

  // filtro: tutto / solo oratorio / solo parrocchia
  let filtro = S.filtroAnno || 'tutto';
  const box = h('div', {});
  const elenco = h('div');

  function disegna() {
    S.filtroAnno = filtro;
    const voci = []
      .concat(filtro === 'parrocchia' ? [] : c.sabati.map(s => ({ id: s.idData, tipo: 'sab', dato: s })))
      .concat(filtro === 'oratorio' ? [] : ev.map(e => ({ id: e.idData, tipo: 'ev', dato: e })))
      .sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : (a.tipo === 'sab' ? -1 : 1));

    elenco.replaceChildren();
    if (!voci.length) { elenco.appendChild(vuoto('Niente da mostrare.')); return; }
    let corrente = null, scheda = null;
    voci.forEach(v => {
      const d = dataDaId(v.id);
      const k = d.getFullYear() + '-' + d.getMonth();
      if (k !== corrente) {
        corrente = k;
        scheda = h('div', { class: 'blocco-mese' }, h('h3', {}, [
          MESI[d.getMonth()], h('span', { class: 'anno' }, d.getFullYear())
        ]));
        elenco.appendChild(scheda);
      }
      scheda.appendChild(v.tipo === 'sab' ? rigaSabato(v.dato, oggi) : rigaEvento(v.dato, oggi));
    });
  }

  const schede = h('div', { class: 'schede' }, [
    ['tutto', 'Tutto'], ['oratorio', 'Solo oratorio'], ['parrocchia', 'Solo parrocchia']
  ].map(t => {
    const b = h('button', { class: filtro === t[0] ? 'on' : '', onclick: () => {
      filtro = t[0];
      schede.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      disegna();
    } }, t[1]);
    return b;
  }));

  box.append(
    h('h2', { style: 'margin-top:4px' }, 'Anno ' + primo.getFullYear() + '–' + ultimo.getFullYear()),
    schede,
    h('div', { class: 'legenda' }, [
      h('span', {}, [h('i', { style: 'background:var(--blu-tenue)' }), 'oratorio']),
      h('span', {}, [h('i', { style: 'background:var(--ambra-tenue)' }), 'con serata']),
      h('span', {}, [h('i', { style: 'background:var(--fondo);border:1px solid var(--linea)' }), 'chiuso']),
      h('span', {}, [h('i', { style: 'background:var(--viola-tenue)' }), 'parrocchia'])
    ]),
    elenco
  );
  disegna();
  mostra(box);
}

/* =====================================================================
   SCHERMATA 5 — GIOCHI
   ===================================================================== */
async function schermataGiochi() {
  mostra(h('p', { class: 'muto' }, 'Carico i giochi…'));
  let giochi;
  try { giochi = await caricaGiochi(); } catch (e) { mostra(errore(e)); return; }

  const unici = campo => [...new Set(giochi.map(g => g[campo]).filter(Boolean))].sort();
  const cerca = h('input', { type: 'search', placeholder: 'Cerca per nome o materiale' });
  const fTipo = select([{ v: '', t: 'Tutti i tipi' }].concat(unici('tipo')), '');
  const fClass = select([{ v: '', t: 'Tutte le classificazioni' }].concat(unici('classificazione')), '');
  const fDurata = select([{ v: '', t: 'Tutte le durate' }].concat(unici('durata')), '');
  const fLuogo = select([{ v: '', t: 'Tutti i luoghi' }].concat(unici('luogo')), '');
  const lista = h('div', { class: 'lista' });

  function filtra() {
    const q = cerca.value.trim().toLowerCase();
    const res = giochi.filter(g =>
      (!q || g.nome.toLowerCase().includes(q) || g.materiale.toLowerCase().includes(q)) &&
      (!fTipo.value || g.tipo === fTipo.value) && (!fClass.value || g.classificazione === fClass.value) &&
      (!fDurata.value || g.durata === fDurata.value) && (!fLuogo.value || g.luogo === fLuogo.value));
    lista.replaceChildren(...res.map(g => h('div', { class: 'riga cliccabile', onclick: () => apriGioco(g.id) }, [
      h('div', { class: 'titolo' }, g.nome),
      h('div', { class: 'sotto' }, [g.tipo, g.classificazione, g.durata, g.luogo].filter(Boolean).join(' · '))
    ])));
    if (!res.length) lista.replaceChildren(vuoto('Nessun gioco corrisponde.'));
  }
  [cerca, fTipo, fClass, fDurata, fLuogo].forEach(el => el.addEventListener('input', filtra));
  filtra();
  const area = h('div');
  mostra(h('div', {}, [
    h('div', { style: 'display:flex;align-items:center;gap:10px;margin-top:4px' }, [
      h('h2', { style: 'margin:0;flex:1' }, 'Giochi (' + giochi.length + ')'),
      h('button', { class: 'b piccolo', onclick: () => moduloGioco(area, null) }, '+ Nuovo')
    ]),
    area, cerca,
    h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px' }, [fTipo, fClass, fDurata, fLuogo]),
    h('div', { style: 'height:10px' }), lista
  ]));
}

/**
 * Modulo del gioco, usato sia per crearne uno nuovo sia per correggerne uno
 * esistente. Se riceve `esistente`, salva in modifica invece che in aggiunta.
 */
async function moduloGioco(area, esistente, annulla, dopoSalvato) {
  let liste;
  try { liste = await caricaListe(); } catch (e) { area.replaceChildren(errore(e)); return; }
  const g = esistente || {};
  const opz = elenco => [{ v: '', t: '— scegli —' }].concat(elenco || []);
  const campi = {
    nome: h('input', { type: 'text', value: g.nome || '', placeholder: 'Nome del gioco' }),
    classificazione: select(opz(liste.classificazione), g.classificazione || ''),
    tipo: select(opz(liste.tipoGioco), g.tipo || ''),
    durata: select(opz(liste.durata), g.durata || ''),
    numSquadre: select(opz(liste.squadre), g.numSquadre || ''),
    luogo: select(opz(liste.luogo), g.luogo || ''),
    materiale: h('textarea', { placeholder: 'Che cosa serve' }, g.materiale || ''),
    preparazione: h('textarea', { placeholder: 'Come si prepara il campo prima di iniziare' }, g.preparazione || ''),
    spiegazione: h('textarea', { placeholder: 'Come si gioca, dall\'inizio alla fine' }, g.spiegazione || ''),
    varianti: h('textarea', { placeholder: 'Facoltativo' }, g.varianti || '')
  };
  // la disattivazione di un gioco è cosa da Responsabili
  const attivo = h('input', { type: 'checkbox', style: 'width:auto;min-height:0;margin-right:8px' });
  attivo.checked = g.attivo !== false;
  const mostraAttivo = esistente && S.utente.livello >= 3;

  const msg = h('div');
  const salva = h('button', { class: 'b', onclick: async () => {
    const dati = {};
    Object.keys(campi).forEach(k => dati[k] = campi[k].value.trim());
    if (esistente) { dati.id = g.id; if (mostraAttivo) dati.attivo = attivo.checked; }
    salva.disabled = true;
    try {
      const r = await api(esistente ? 'modificaGioco' : 'nuovoGioco', dati);
      S.giochi = null;
      toast(esistente ? 'Scheda aggiornata' : 'Gioco aggiunto');
      if (dopoSalvato) dopoSalvato(r); else apriGioco(r.id);
    } catch (e) { msg.replaceChildren(errore(e)); salva.disabled = false; }
  } }, esistente ? 'Salva le modifiche' : 'Aggiungi il gioco');

  const corpo = [
    h('p', { class: 'muto piccolo', style: 'margin-top:0' }, 'Tutti i campi sono obbligatori tranne le varianti.'),
    h('label', {}, 'Nome'), campi.nome,
    h('label', {}, 'Classificazione'), campi.classificazione,
    h('label', {}, 'Tipo'), campi.tipo,
    h('label', {}, 'Durata'), campi.durata,
    h('label', {}, 'Numero squadre'), campi.numSquadre,
    h('label', {}, 'Luogo'), campi.luogo,
    h('label', {}, 'Materiale'), campi.materiale,
    h('label', {}, 'Preparazione'), campi.preparazione,
    h('label', {}, 'Come si gioca'), campi.spiegazione,
    h('label', {}, 'Varianti (facoltativo)'), campi.varianti,
    mostraAttivo ? h('label', {}, [attivo, 'Gioco attivo (se lo togli sparisce dagli elenchi)']) : null,
    msg,
    h('div', { class: 'azioni' }, [salva,
      h('button', { class: 'b secondario', onclick: annulla || (() => area.replaceChildren()) }, 'Annulla')])
  ];

  if (esistente) {
    area.replaceChildren(h('div', {}, corpo));
  } else {
    area.replaceChildren(h('div', { class: 'modulo' }, [h('div', { class: 'titolo' }, 'Nuovo gioco')].concat(corpo)));
    campi.nome.focus();
  }
}

async function apriGioco(id) {
  const giochi = await caricaGiochi();
  const g = giochi.find(x => x.id === id);
  if (!g) { toast('Gioco non trovato', true); return; }
  const para = (tit, testo) => testo ? h('div', { style: 'margin-top:14px' }, [h('h3', {}, tit), h('p', { style: 'white-space:pre-wrap;margin-top:4px' }, testo)]) : null;
  segnaNav('giochi');

  // La modifica sta in una tendina chiusa: chi consulta la scheda durante il
  // gioco non incontra nessun pulsante da premere per sbaglio.
  const areaMod = h('div');
  const tend = tendina('Correggi questa scheda', null, areaMod);
  tend.addEventListener('toggle', () => {
    if (tend.open && !areaMod.firstChild) moduloGioco(areaMod, g, () => { tend.open = false; areaMod.replaceChildren(); });
  });

  mostra(h('div', {}, [
    h('button', { class: 'b secondario piccolo', onclick: schermataGiochi }, '← Tutti i giochi'),
    h('h2', {}, g.nome),
    h('p', { class: 'muto' }, [g.tipo, g.classificazione, g.durata, g.numSquadre ? g.numSquadre + ' squadre' : '', g.luogo].filter(Boolean).join(' · ')),
    para('Materiale', g.materiale), para('Preparazione', g.preparazione), para('Come si gioca', g.spiegazione), para('Varianti', g.varianti),
    g.volte ? h('p', { class: 'muto piccolo', style: 'margin-top:16px' }, 'Giocato ' + g.volte + ' volte' + (g.ultimo ? ', l\'ultima il ' + g.ultimo : '')) : null,
    h('div', { style: 'margin-top:26px' }, tend)
  ]));
}

/* =====================================================================
   SCHERMATA 6 — GESTIONE (Responsabili)
   ===================================================================== */
async function schermataGestione(scheda, apri) {
  scheda = scheda || 'programma';
  const tab = h('div', { class: 'schede' }, [
    ['programma', 'Programma'], ['promemoria', 'Promemoria'], ['eventi', 'Eventi'],
    ['estate', 'Estate'], ['contatti', 'Contatti'], ['cruscotto', 'Cruscotto']
  ].map(t => h('button', { class: t[0] === scheda ? 'on' : '', onclick: () => schermataGestione(t[0]) }, t[1])));
  const contenuto = h('div', {}, h('p', { class: 'muto' }, 'Carico…'));
  mostra(h('div', {}, [h('h2', { style: 'margin-top:4px' }, 'Gestione'), tab, contenuto]));
  try {
    if (scheda === 'programma') await gestioneProgramma(contenuto);
    else if (scheda === 'promemoria') await gestionePromemoria(contenuto);
    else if (scheda === 'eventi') await gestioneEventi(contenuto, apri);
    else if (scheda === 'estate') await gestioneEstate(contenuto);
    else if (scheda === 'contatti') await gestioneContatti(contenuto);
    else await gestioneCruscotto(contenuto);
  } catch (e) { contenuto.replaceChildren(errore(e)); }
}

/**
 * Copia negli appunti. Dentro la cornice di Apps Script l'API moderna spesso
 * non è disponibile, quindi c'è il ripiego sulla selezione del testo e, se
 * fallisce anche quella, si mostra il testo perché lo si copi a mano.
 */
async function copiaTesto(testo, area) {
  try {
    await navigator.clipboard.writeText(testo);
    toast('Copiato');
    return;
  } catch (e) { /* si prova il ripiego */ }
  const ta = h('textarea', { readonly: 'readonly', style: 'position:fixed;left:-9999px;top:0' }, testo);
  document.body.appendChild(ta);
  ta.select();
  let fatto = false;
  try { fatto = document.execCommand('copy'); } catch (e) { fatto = false; }
  document.body.removeChild(ta);
  if (fatto) { toast('Copiato'); return; }
  if (area) {
    const manuale = h('textarea', { readonly: 'readonly', style: 'height:180px;margin-top:10px' }, testo);
    area.replaceChildren(h('p', { class: 'piccolo muto' }, 'Il telefono non permette la copia automatica: tieni premuto sul testo e copialo.'), manuale);
    manuale.focus(); manuale.select();
  } else {
    toast('Copia non riuscita', true);
  }
}

/** Collegamento che apre WhatsApp sulla chat di una persona, messaggio già scritto. */
function linkWhatsApp(numero, testo) {
  return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(testo);
}

/**
 * Promemoria del sabato: un messaggio già pronto per ciascuno di chi ha un
 * incarico, più il riepilogo per il gruppo.
 */
async function gestionePromemoria(cont) {
  await caricaCalendario();
  const oggi = oggiId();
  const aperti = S.calendario.sabati.filter(s => s.tipo !== 'Chiuso');
  const primo = (aperti.find(s => s.idData >= oggi) || aperti[aperti.length - 1] || {}).idData;
  const area = h('div');
  const sel = selettoreData(s => s.tipo !== 'Chiuso', S.promemoriaData || primo, id => { S.promemoriaData = id; carica(id); });
  cont.replaceChildren(h('label', {}, 'Sabato'), sel, area);

  async function carica(idData) {
    area.replaceChildren(h('p', { class: 'muto' }, 'Preparo i messaggi…'));
    let d;
    try { d = await api('promemoria', { idData }); } catch (e) { area.replaceChildren(errore(e)); return; }
    if (d.chiuso) { area.replaceChildren(vuoto('Quel sabato l\'oratorio è chiuso.')); return; }

    // --- messaggio per il gruppo
    const areaCopia = h('div');
    const gruppo = h('div', { class: 'modulo' }, [
      h('div', { class: 'titolo' }, 'Messaggio per il gruppo'),
      h('p', { class: 'piccolo muto' }, 'Copialo e incollalo nel gruppo degli animatori.'),
      h('pre', { style: 'white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--fondo);border-radius:var(--raggio-xs);padding:12px;margin:8px 0 0' }, d.messaggioGruppo),
      h('div', { class: 'azioni' }, h('button', { class: 'b', onclick: () => copiaTesto(d.messaggioGruppo, areaCopia) }, 'Copia il messaggio')),
      areaCopia
    ]);

    // --- messaggi personali
    const conNumero = d.persone.filter(p => p.telefono);
    const righe = conNumero.map(p => {
      const riassunto = p.incarichi.map(i => i.attivita + (i.ruolo === 'Responsabile' ? '' : ' (aiuto)')).join(' · ');
      const areaP = h('div');
      return h('div', { class: 'modulo' }, [
        h('div', { class: 'titolo' }, [p.nomeVis,
          p.presenza === 'assente' ? h('span', { class: 'etichetta rossa' }, 'ha detto che non c\'è') : null,
          p.presenza === 'nessuna' ? h('span', { class: 'etichetta' }, 'non ha risposto') : null]),
        h('div', { class: 'sotto' }, riassunto),
        h('div', { class: 'azioni' }, [
          h('a', { class: 'b', href: linkWhatsApp(p.telefono, p.messaggio), target: '_blank', rel: 'noopener' }, 'Avvisa su WhatsApp'),
          h('button', { class: 'b secondario piccolo', onclick: () => copiaTesto(p.messaggio, areaP) }, 'Copia')
        ]),
        areaP
      ]);
    });

    const senza = d.senzaNumero.length ? h('div', { class: 'avviso' }, [
      h('div', { style: 'font-weight:700;margin-bottom:4px' }, 'Senza un numero utilizzabile (' + d.senzaNumero.length + ')'),
      h('div', { class: 'piccolo' }, d.senzaNumero.map(x => x.nomeVis + (x.contatto ? ' — ' + x.contatto : '')).join(', ')),
      h('div', { class: 'piccolo', style: 'margin-top:6px' }, 'Correggi il contatto in Anagrafica per farli comparire qui.')
    ]) : null;

    area.replaceChildren(
      gruppo,
      h('h2', {}, 'Uno per uno (' + conNumero.length + ')'),
      h('p', { class: 'piccolo muto', style: 'margin-top:-6px' }, 'Ogni pulsante apre WhatsApp sulla chat della persona con il messaggio già scritto: devi solo premere invio.'),
      senza,
      ...righe
    );
  }
  carica(sel.value);
}

/** Calendario parrocchiale: elenco per mese, con aggiunta, modifica ed eliminazione. */
async function gestioneEventi(cont, apriId) {
  const d = await api('eventi');
  const area = h('div');
  const elenco = h('div');
  const oggi = oggiId();

  function disegnaElenco() {
    elenco.replaceChildren();
    if (!d.eventi.length) { elenco.appendChild(vuoto('Nessun evento in calendario.')); return; }
    let corrente = null, scheda = null;
    d.eventi.forEach(e => {
      const dd = dataDaId(e.idData);
      const k = dd.getFullYear() + '-' + dd.getMonth();
      if (k !== corrente) {
        corrente = k;
        scheda = h('div', { class: 'blocco-mese' }, h('h3', {}, [MESI[dd.getMonth()], h('span', { class: 'anno' }, dd.getFullYear())]));
        elenco.appendChild(scheda);
      }
      scheda.appendChild(h('button', {
        class: 'sab ev' + (e.idDataFine < oggi ? ' passato' : ''),
        onclick: () => modulo(e)
      }, [
        h('div', { class: 'data' }, [h('span', { class: 'n' }, dd.getDate()), h('span', { class: 'g' }, GIORNI_BREVI[dd.getDay()])]),
        h('div', { class: 'corpo' }, [
          h('div', { class: 'primaria' }, [e.titolo, e.categoria ? h('span', { class: 'etichetta viola' }, e.categoria) : null]),
          h('div', { class: 'secondaria' }, (e.oraInizio || 'tutto il giorno') + (e.piuGiorni ? ' · più giorni' : '') + (e.luogo ? ' · ' + e.luogo : ''))
        ]),
        icona('vai', 'vai')
      ]));
    });
  }

  function modulo(e) {
    e = e || { id: '', idData: '', idDataFine: '', titolo: '', categoria: '', oraInizio: '', oraFine: '', luogo: '', nota: '' };
    const iso = id => id && id.length === 8 ? id.slice(0, 4) + '-' + id.slice(4, 6) + '-' + id.slice(6, 8) : '';
    const compatta = v => String(v || '').replace(/-/g, '');

    const inizio = h('input', { type: 'date', value: iso(e.idData) });
    const fine = h('input', { type: 'date', value: iso(e.idDataFine) });
    const titolo = h('input', { type: 'text', value: e.titolo, placeholder: 'Titolo dell\'evento' });
    const categoria = select([{ v: '', t: '— scegli —' }].concat(d.categorie || []), e.categoria);
    const oraI = h('input', { type: 'time', value: e.oraInizio });
    const oraF = h('input', { type: 'time', value: e.oraFine });
    const luogo = h('input', { type: 'text', value: e.luogo, placeholder: 'Dove si svolge' });
    const nota = h('textarea', { placeholder: 'Note' }, e.nota);
    const msg = h('div');

    const salva = h('button', { class: 'b', onclick: async () => {
      salva.disabled = true;
      try {
        const r = await api('salvaEvento', {
          id: e.id, idData: compatta(inizio.value), idDataFine: compatta(fine.value) || compatta(inizio.value),
          titolo: titolo.value, categoria: categoria.value,
          oraInizio: oraI.value, oraFine: oraF.value, luogo: luogo.value, nota: nota.value
        });
        toast(e.id ? 'Evento aggiornato' : 'Evento aggiunto');
        S.calendario = null;
        schermataGestione('eventi', r.id);
      } catch (err) { msg.replaceChildren(errore(err)); salva.disabled = false; }
    } }, e.id ? 'Salva' : 'Aggiungi l\'evento');

    const elimina = e.id ? h('button', { class: 'b pericolo', onclick: async () => {
      if (!confirm('Eliminare «' + e.titolo + '»? L\'operazione non si annulla.')) return;
      try { await api('eliminaEvento', { id: e.id }); toast('Evento eliminato'); schermataGestione('eventi'); }
      catch (err) { msg.replaceChildren(errore(err)); }
    } }, 'Elimina') : null;

    area.replaceChildren(h('div', { class: 'modulo' }, [
      h('div', { class: 'titolo' }, e.id ? 'Modifica evento · ' + e.id : 'Nuovo evento'),
      h('label', {}, 'Titolo'), titolo,
      h('label', {}, 'Categoria'), categoria,
      h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px' }, [
        h('div', {}, [h('label', {}, 'Dal'), inizio]),
        h('div', {}, [h('label', {}, 'Al (se dura più giorni)'), fine])
      ]),
      h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px' }, [
        h('div', {}, [h('label', {}, 'Ora inizio'), oraI]),
        h('div', {}, [h('label', {}, 'Ora fine'), oraF])
      ]),
      h('p', { class: 'muto piccolo' }, 'Senza orario l\'evento vale per tutta la giornata.'),
      h('label', {}, 'Luogo'), luogo,
      h('label', {}, 'Note'), nota,
      msg,
      h('div', { class: 'azioni' }, [salva, elimina,
        h('button', { class: 'b secondario', onclick: () => area.replaceChildren() }, 'Chiudi')])
    ]));
    window.scrollTo(0, 0);
  }

  cont.replaceChildren(
    h('div', { class: 'azioni', style: 'margin:0 0 14px' }, h('button', { class: 'b secondario', onclick: () => modulo(null) }, '+ Nuovo evento')),
    area, elenco
  );
  disegnaElenco();
  if (apriId) {
    const e = d.eventi.find(x => x.id === apriId);
    if (e) modulo(e);
  }
}

function selettoreData(filtro, iniziale, onChange) {
  const sabati = S.calendario.sabati.filter(filtro || (() => true));
  const sel = select(sabati.map(s => ({ v: s.idData, t: s.breve + (s.evento ? ' · ' + s.evento : '') + (s.tipo === 'Lungo' ? ' · serata' : '') })), iniziale);
  sel.onchange = () => onChange(sel.value);
  return sel;
}

async function gestioneProgramma(cont) {
  await caricaCalendario(); await caricaAnimatori(); await caricaListe();
  const oggi = oggiId();
  const aperti = S.calendario.sabati.filter(s => s.tipo !== 'Chiuso');
  const primo = (aperti.find(s => s.idData >= oggi) || aperti[aperti.length - 1] || {}).idData;
  const area = h('div');
  const sel = selettoreData(s => s.tipo !== 'Chiuso', S.gestioneData || primo, id => { S.gestioneData = id; carica(id); });
  cont.replaceChildren(h('label', {}, 'Sabato'), sel, area);

  async function carica(idData) {
    area.replaceChildren(h('p', { class: 'muto' }, 'Carico…'));
    let g;
    try { g = await api('gestioneSabato', { idData }); } catch (e) { area.replaceChildren(errore(e)); return; }
    if (!g.sabato.voci.length) { area.replaceChildren(vuoto('Nessuna voce a programma per questa data.')); return; }
    const scoperte = g.sabato.voci.filter(v => v.scoperto);
    const senzaRisposta = g.sabato.voci.reduce((n, v) =>
      n + v.persone.filter(p => p.ruolo === 'Responsabile' && p.presenza === 'nessuna').length, 0);
    const riepilogo = scoperte.length
      ? h('div', { class: 'errore' }, scoperte.length === 1
          ? 'Un responsabile ha detto che non ci sarà: ' + scoperte[0].attivita
          : scoperte.length + ' attività hanno il responsabile assente: ' + scoperte.map(v => v.attivita).join(', '))
      : (senzaRisposta
          ? h('div', { class: 'avviso' }, senzaRisposta + ' responsabil' + (senzaRisposta === 1 ? 'e non ha' : 'i non hanno') + ' ancora detto se ci sarà.')
          : h('div', { class: 'modulo', style: 'text-align:center' }, h('span', { class: 'muto piccolo' }, 'Tutti i responsabili hanno confermato la presenza.')));
    area.replaceChildren(riepilogo, ...g.sabato.voci.map(v => blocchettoGestioneVoce(v, g)));
  }
  carica(sel.value);
}

/** Voce di programma nel pannello di gestione: dettaglio, note, assegnazioni. */
function blocchettoGestioneVoce(v, g) {
  const box = h('div', { class: 'modulo' });
  const testa = h('div');
  const assegn = h('div');

  function disegnaTesta() {
    let tipologia = null;
    if (v.rotazione && g.rotazione && g.rotazione.length) {
      tipologia = select(g.rotazione.map(r => ({ v: r.id, t: r.nome })), v.idAtt);
      tipologia.onchange = async () => {
        if (!confirm('Cambiare la tipologia di gioco di questo sabato? Gioco scelto, persone e postazioni vengono sostituiti con la squadra della nuova tipologia.')) { tipologia.value = v.idAtt; return; }
        try { await api('cambiaTipoGioco', { idData: g.sabato.calendario.idData, idAtt: tipologia.value }); toast('Tipologia cambiata'); schermataGestione('programma'); }
        catch (e) { toast(e, true); tipologia.value = v.idAtt; }
      };
    }
    testa.replaceChildren(
      h('div', { class: 'titolo' }, v.attivita),
      tipologia ? h('div', {}, [h('label', {}, 'Tipologia di questo sabato'), tipologia]) : null,
      h('div', { style: tipologia ? 'margin-top:8px' : '' }, v.descrizione || h('span', { class: 'muto' }, 'da definire')),
      v.tema ? h('div', { class: 'sotto' }, 'Tema del periodo: ' + v.tema) : null,
      v.note ? h('div', { class: 'sotto' }, v.note) : null,
      h('div', { class: 'azioni' }, h('button', { class: 'b secondario piccolo', onclick: async () => {
        testa.replaceChildren(await moduloProgramma(v, r => { Object.assign(v, r); disegnaTesta(); }, disegnaTesta));
      } }, 'Modifica dettaglio'))
    );
  }

  function disegnaAssegnazioni() {
    const righe = v.persone.map(p => {
      const ruolo = select(g.ruoli, p.ruolo);
      ruolo.style.width = 'auto'; ruolo.style.minHeight = '36px';
      ruolo.onchange = async () => {
        try { await api('salvaAssegnazione', { idProg: v.idProg, idAnimatore: p.idAnimatore, idAnimatoreVecchio: p.idAnimatore, ruolo: ruolo.value, azione: 'cambia' }); p.ruolo = ruolo.value; toast('Ruolo aggiornato'); }
        catch (e) { toast(e, true); }
      };
      const segno = p.presenza === 'assente'
        ? h('span', { class: 'etichetta rossa' }, 'assente')
        : (p.presenza === 'nessuna' ? h('span', { class: 'etichetta' }, '?') : null);
      return h('div', { style: 'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--linea)' }, [
        h('span', { style: 'flex:1' }, [p.nomeVis, segno]), ruolo,
        h('button', { class: 'b pericolo piccolo', onclick: async () => {
          if (!confirm('Togliere ' + p.nomeVis + ' da questa voce?')) return;
          try { await api('salvaAssegnazione', { idProg: v.idProg, idAnimatore: p.idAnimatore, azione: 'rimuovi' }); v.persone = v.persone.filter(x => x !== p); disegnaAssegnazioni(); toast('Rimosso'); }
          catch (e) { toast(e, true); }
        } }, 'Togli')
      ]);
    });
    const nuovo = select([{ v: '', t: 'Aggiungi animatore…' }].concat(g.animatori.map(a => ({ v: a.id, t: a.nomeVis }))), '');
    const ruoloNuovo = select(g.ruoli, g.ruoli[0]);
    const btn = h('button', { class: 'b piccolo', onclick: async () => {
      if (!nuovo.value) return;
      try {
        await api('salvaAssegnazione', { idProg: v.idProg, idAnimatore: nuovo.value, ruolo: ruoloNuovo.value, azione: 'aggiungi' });
        const a = g.animatori.find(x => x.id === nuovo.value);
        v.persone.push({ idAnimatore: a.id, nomeVis: a.nomeVis, ruolo: ruoloNuovo.value });
        disegnaAssegnazioni(); toast('Aggiunto');
      } catch (e) { toast(e, true); }
    } }, 'Aggiungi');
    assegn.replaceChildren(
      h('label', {}, 'Chi se ne occupa'),
      ...righe,
      righe.length ? null : h('p', { class: 'muto piccolo' }, 'Nessuno assegnato.'),
      h('div', { style: 'display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px;align-items:center' }, [nuovo, ruoloNuovo, btn])
    );
  }
  disegnaTesta(); disegnaAssegnazioni();
  box.append(testa, assegn);
  if (v.conPostazioni) box.appendChild(editorPostazioni(v, g));
  return box;
}

/** Editor delle postazioni di una voce: stand, secondo gioco, personaggi della serata. */
function editorPostazioni(v, g) {
  const cont = h('div', { style: 'margin-top:12px' });
  const etichetta = v.categoria === 'Serata' ? 'Postazioni e personaggi della serata'
    : v.idAtt === 'GioSta' ? 'Gli stand' : 'Altri giochi del pomeriggio';
  const animOpz = [{ v: '', t: '— nessuno —' }].concat(g.animatori.map(a => ({ v: a.id, t: a.nomeVis })));

  async function modulo(p, dove) {
    const cg = await campoGioco(p.idGioco, false);
    const gioco = cg.sel;
    const anim = select(animOpz, p.idAnimatore || '');
    const ruolo = h('input', { type: 'text', value: p.ruolo || '', placeholder: v.categoria === 'Serata' ? 'Ruolo o personaggio' : 'Ruolo (facoltativo)' });
    const mat = h('input', { type: 'text', value: p.materiale || '', placeholder: 'Materiale in più rispetto alla scheda' });
    const note = h('input', { type: 'text', value: p.note || '', placeholder: 'Note' });
    const salva = h('button', { class: 'b piccolo', onclick: async () => {
      try {
        await api('salvaPostazione', { idProg: v.idProg, nPostazione: p.n, idGioco: gioco.value, idAnimatore: anim.value, ruolo: ruolo.value, materiale: mat.value, note: note.value });
        toast('Postazione ' + p.n + ' salvata');
      } catch (e) { toast(e, true); }
    } }, 'Salva');
    const elimina = h('button', { class: 'b pericolo piccolo', onclick: async () => {
      if (!confirm('Eliminare la postazione ' + p.n + '?')) return;
      try { await api('salvaPostazione', { idProg: v.idProg, nPostazione: p.n, elimina: true }); toast('Eliminata'); schermataGestione('programma'); }
      catch (e) { toast(e, true); }
    } }, 'Elimina');
    dove.replaceChildren(h('div', { class: 'modulo', style: 'margin:8px 0' }, [
      h('div', { class: 'titolo' }, 'Postazione ' + p.n),
      h('label', {}, 'Gioco'), cg.contenitore,
      h('label', {}, 'Animatore'), anim,
      h('label', {}, 'Ruolo / personaggio'), ruolo,
      h('label', {}, 'Materiale'), mat,
      h('label', {}, 'Note'), note,
      h('div', { class: 'azioni' }, [salva, elimina])
    ]));
  }

  const lista = h('div');
  (v.postazioni || []).forEach(p => { const d = h('div'); lista.appendChild(d); modulo(p, d); });
  const prossimoN = (v.postazioni || []).reduce((m, p) => Math.max(m, p.n || 0), 0) + 1;
  const det = tendina(etichetta, (v.postazioni || []).length || null, h('div', {}, [
    lista,
    h('div', { class: 'azioni' }, h('button', { class: 'b secondario piccolo', onclick: () => {
      const n = lista.children.length + prossimoN - (v.postazioni || []).length;
      const d = h('div'); lista.appendChild(d); modulo({ n }, d);
    } }, '+ Aggiungi postazione'))
  ]), (v.postazioni || []).length > 0 && (v.postazioni || []).some(p => !p.idAnimatore));
  cont.appendChild(det);
  return cont;
}

async function adminAnagrafica(cont) {
  const d = await api('anagrafica');
  const area = h('div');
  const lista = h('div', { class: 'lista' });
  d.animatori.forEach(a => lista.appendChild(h('div', { class: 'riga cliccabile', style: a.attivo ? '' : 'opacity:.5', onclick: () => modulo(a) }, [
    h('span', { class: 'titolo' }, a.nomeVis), h('span', { class: 'etichetta' }, a.grado), a.attivo ? null : h('span', { class: 'etichetta rossa' }, 'non attivo'),
    h('div', { class: 'sotto' }, a.nome + ' ' + a.cognome + (a.anno ? ' · ' + a.anno : ''))
  ])));
  cont.replaceChildren(h('div', { class: 'azioni', style: 'margin:0 0 12px' }, h('button', { class: 'b secondario', onclick: () => modulo({ id: '', nome: '', cognome: '', nomeVis: '', anno: '', grado: d.gradi[0], attivo: true, contatto: '' }) }, 'Nuovo animatore')), area, lista);

  function modulo(a) {
    const nome = h('input', { type: 'text', value: a.nome }), cognome = h('input', { type: 'text', value: a.cognome });
    const nomeVis = h('input', { type: 'text', value: a.nomeVis, placeholder: 'Vuoto = Nome + iniziale cognome' });
    const anno = h('input', { type: 'number', value: a.anno || '', inputmode: 'numeric' });
    const grado = select(d.gradi, a.grado);
    const attivo = h('input', { type: 'checkbox', style: 'width:auto;min-height:0;margin-right:8px' }); attivo.checked = !!a.attivo;
    const contatto = h('input', { type: 'text', value: a.contatto });
    const btn = h('button', { class: 'b', onclick: async () => {
      try {
        await api('salvaAnagrafica', { id: a.id, nome: nome.value, cognome: cognome.value, nomeVis: nomeVis.value, anno: anno.value, grado: grado.value, attivo: attivo.checked, contatto: contatto.value });
        S.animatori = null; toast('Anagrafica salvata'); schermataAdmin('anagrafica');
      } catch (e) { toast(e, true); }
    } }, 'Salva');
    area.replaceChildren(h('div', { class: 'modulo' }, [
      h('div', { class: 'titolo' }, a.id ? a.id : 'Nuovo animatore'),
      h('label', {}, 'Nome'), nome, h('label', {}, 'Cognome'), cognome, h('label', {}, 'Nome visualizzato'), nomeVis,
      h('label', {}, 'Anno di nascita'), anno, h('label', {}, 'Grado'), grado,
      h('label', {}, [attivo, 'Attivo']), h('label', {}, 'Contatto'), contatto,
      h('div', { class: 'azioni' }, [btn, h('button', { class: 'b secondario', onclick: () => area.replaceChildren() }, 'Annulla')])
    ]));
    window.scrollTo(0, 0);
  }
}

async function adminSquadre(cont) {
  const d = await api('squadre');
  const area = h('div');
  const sel = select(d.attivita.map(a => ({ v: a.id, t: a.nome })), S.squadraAtt || d.attivita[0].id);
  sel.onchange = () => { S.squadraAtt = sel.value; disegna(); };
  cont.replaceChildren(h('label', {}, 'Attività'), sel, area);

  function disegna() {
    const membri = d.squadre.filter(q => q.idAtt === sel.value).sort((a, b) => (a.ruolo === 'Responsabile' ? 0 : 1) - (b.ruolo === 'Responsabile' ? 0 : 1) || a.nomeVis.localeCompare(b.nomeVis, 'it'));
    const righe = membri.map(q => {
      const ruolo = select(d.ruoli, q.ruolo); ruolo.style.width = 'auto'; ruolo.style.minHeight = '36px';
      ruolo.onchange = async () => { try { await api('salvaSquadra', { idAtt: q.idAtt, idAnimatore: q.idAnimatore, ruolo: ruolo.value }); q.ruolo = ruolo.value; toast('Aggiornato'); } catch (e) { toast(e, true); } };
      return h('div', { style: 'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--linea)' }, [
        h('span', { style: 'flex:1' }, q.nomeVis), ruolo,
        h('button', { class: 'b pericolo piccolo', onclick: async () => {
          if (!confirm('Togliere ' + q.nomeVis + ' dalla squadra?')) return;
          try { await api('rimuoviSquadra', { idAtt: q.idAtt, idAnimatore: q.idAnimatore }); d.squadre = d.squadre.filter(x => x !== q); disegna(); toast('Rimosso'); } catch (e) { toast(e, true); }
        } }, 'Togli')
      ]);
    });
    const nuovo = select([{ v: '', t: 'Aggiungi animatore…' }].concat(d.animatori.map(a => ({ v: a.id, t: a.nomeVis }))), '');
    const ruoloNuovo = select(d.ruoli, d.ruoli[d.ruoli.length - 1]);
    const btn = h('button', { class: 'b piccolo', onclick: async () => {
      if (!nuovo.value) return;
      try {
        const r = await api('salvaSquadra', { idAtt: sel.value, idAnimatore: nuovo.value, ruolo: ruoloNuovo.value });
        const a = d.animatori.find(x => x.id === nuovo.value);
        d.squadre = d.squadre.filter(x => !(x.idAtt === sel.value && x.idAnimatore === nuovo.value));
        d.squadre.push({ idAtt: sel.value, idAnimatore: a.id, nomeVis: a.nomeVis, ruolo: r.ruolo });
        disegna(); toast('Aggiunto');
      } catch (e) { toast(e, true); }
    } }, 'Aggiungi');
    area.replaceChildren(...righe, righe.length ? null : vuoto('Nessun membro.'),
      h('div', { style: 'display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:10px;align-items:center' }, [nuovo, ruoloNuovo, btn]));
  }
  disegna();
}

async function adminArchivio(cont) {
  const svuota = h('input', { type: 'checkbox', style: 'width:auto;min-height:0;margin-right:8px' });
  const esito = h('div');
  const btn = h('button', { class: 'b pericolo', onclick: async () => {
    if (!confirm('Archiviare l\'anno' + (svuota.checked ? ' e SVUOTARE Presenze e Assegnazioni' : '') + '? L\'operazione non si annulla.')) return;
    btn.disabled = true; esito.replaceChildren(h('p', { class: 'muto' }, 'Archivio in corso…'));
    try { const r = await api('archivia', { svuota: svuota.checked }); esito.replaceChildren(h('p', {}, ['Fatto. ', h('a', { href: r.url, target: '_blank', rel: 'noopener' }, 'Apri il file storico')])); }
    catch (e) { esito.replaceChildren(errore(e)); }
    btn.disabled = false;
  } }, 'Archivia l\'anno');
  cont.replaceChildren(
    h('p', {}, 'Copia Programma, Assegnazioni, Presenze e Calendario in un file storico nella stessa cartella e aggiorna i contatori dei giochi nel file permanente.'),
    h('label', {}, [svuota, 'Svuota anche Presenze e Assegnazioni nel file corrente']),
    h('div', { style: 'margin-top:12px' }, btn), esito
  );
}
